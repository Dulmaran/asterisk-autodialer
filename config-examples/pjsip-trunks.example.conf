; Example PJSIP trunk definition required by scripts/obzvon_im
; (dials PJSIP/8<number>@BEELINE_VRN for each call-file it generates).
; Replace <PROVIDER_IP> with your own provider's IP/port.

; -----------------------------------------------------------------------------------------
; BEELINE_VRN — outbound trunk used by obzvon_im for the "МИМ" (internet-shop) auto-dial
; -----------------------------------------------------------------------------------------

[BEELINE_VRN]
type=endpoint
transport=udp-transport
context=from-fxo
disallow=all
allow=alaw
allow=ulaw
aors=BEELINE_VRN
; from_domain=<PROVIDER_IP>:5060
t38_udptl=no
t38_udptl_ec=none
fax_detect=no
t38_udptl_nat=no
dtmf_mode=auto

[BEELINE_VRN]
type=aor
qualify_frequency=60
contact=sip:<PROVIDER_IP>:5060

[BEELINE_VRN]
type=identify
endpoint=BEELINE_VRN
match=<PROVIDER_IP>:5060
